<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>skillCalculator — SkillCraft Task 01</title>
  <style>
    :root{
      --bg:#070b16; --panel:rgba(18,25,45,.78); --panel2:rgba(255,255,255,.06);
      --text:#f7f9ff; --muted:#9aa5bf; --accent:#6c63ff; --accent2:#22d3ee;
      --danger:#ff5c7a; --key:#111a2e; --border:rgba(255,255,255,.09);
      --shadow:0 24px 70px rgba(0,0,0,.42);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:var(--text); background:
      radial-gradient(circle at 15% 10%,rgba(108,99,255,.25),transparent 32%),
      radial-gradient(circle at 90% 85%,rgba(34,211,238,.15),transparent 28%),var(--bg);
    }
    .app{width:min(430px,100%); position:relative}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .brand{font-weight:800;letter-spacing:.5px;font-size:20px}
    .brand span{color:var(--accent2)}
    .task{font-size:11px;color:var(--muted);margin-top:3px}
    .icon-btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);
      width:40px;height:40px;border-radius:13px;cursor:pointer;font-size:17px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:30px;
      padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .display{min-height:150px;padding:20px 17px 14px;display:flex;flex-direction:column;
      justify-content:flex-end;text-align:right;overflow:hidden}
    .expression{min-height:28px;color:var(--muted);font-size:18px;white-space:nowrap;overflow:auto;scrollbar-width:none}
    .result{font-size:48px;font-weight:800;letter-spacing:-1.8px;white-space:nowrap;overflow:auto;scrollbar-width:none}
    .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
    button.key{height:64px;border:1px solid var(--border);border-radius:19px;background:var(--key);
      color:var(--text);font-size:20px;font-weight:700;cursor:pointer;transition:.12s transform,.12s filter}
    button.key:hover{filter:brightness(1.18)}
    button.key:active{transform:scale(.95)}
    .operator{background:linear-gradient(145deg,rgba(108,99,255,.25),rgba(108,99,255,.10))!important;color:#cfcaff!important}
    .equals{background:linear-gradient(135deg,var(--accent),#8b5cf6)!important}
    .danger{color:#ff91a5!important}
    .wide{grid-column:span 2}
    .history{margin-top:14px;display:none;border-top:1px solid var(--border);padding-top:14px}
    .history.show{display:block}
    .history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
    .history-title{font-weight:750}.clear-history{font-size:12px;color:var(--accent2);cursor:pointer}
    .history-list{max-height:170px;overflow:auto;display:grid;gap:7px}
    .history-item{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px}
    .history-item b{display:block;margin-top:2px;font-size:16px}
    .footer{text-align:center;color:var(--muted);font-size:11px;margin-top:13px}
    @media(max-width:360px){button.key{height:58px}.result{font-size:40px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div><div class="brand">skill<span>calculator</span></div><div class="task">SkillCraft Technology • Task 01</div></div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☀</button>
    </div>

    <section class="card">
      <div class="display">
        <div class="expression" id="expression">Ready</div>
        <div class="result" id="result">0</div>
      </div>

      <div class="keys" id="keys">
        <button class="key danger" data-action="clear">AC</button>
        <button class="key" data-action="sign">±</button>
        <button class="key" data-action="percent">%</button>
        <button class="key operator" data-value="÷">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="×">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="−">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key wide" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>

      <div class="history" id="history">
        <div class="history-head"><div class="history-title">History</div><div class="clear-history" id="clearHistory">Clear</div></div>
        <div class="history-list" id="historyList"></div>
      </div>
    </section>
    <div class="footer">Keyboard supported • Responsive • No libraries required</div>
  </main>

<script>
(() => {
  const resultEl = document.getElementById('result');
  const expressionEl = document.getElementById('expression');
  const historyEl = document.getElementById('history');
  const historyList = document.getElementById('historyList');
  let current = '0', previous = null, operator = null, waiting = false, history = [];

  const symbols = {'+':'+','−':'-','×':'*','÷':'/'};

  function render() {
    resultEl.textContent = current;
    expressionEl.textContent = previous !== null && operator ? `${previous} ${operator}` : (current === '0' ? 'Ready' : '');
  }
  function inputDigit(d) {
    if (waiting || current === 'Error') { current = d; waiting = false; }
    else current = current === '0' ? d : current + d;
    render();
  }
  function inputDecimal() {
    if (waiting || current === 'Error') { current='0.'; waiting=false; }
    else if (!current.includes('.')) current += '.';
    render();
  }
  function calculate(a,b,op) {
    a=Number(a); b=Number(b);
    if (op==='+') return a+b;
    if (op==='−') return a-b;
    if (op==='×') return a*b;
    if (op==='÷') return b===0 ? null : a/b;
  }
  function chooseOperator(op) {
    if (current === 'Error') return;
    if (operator && previous !== null && !waiting) {
      const val = calculate(previous,current,operator);
      if (val === null) return showError();
      current = clean(val); previous = current;
    } else previous = current;
    operator = op; waiting = true; render();
  }
  function clean(n) {
    if (!Number.isFinite(n)) return 'Error';
    return String(Math.round((n + Number.EPSILON) * 1e12) / 1e12);
  }
  function equals() {
    if (!operator || previous === null || current === 'Error') return;
    const a=previous,b=current,op=operator, val=calculate(a,b,op);
    if (val === null) return showError();
    const out=clean(val);
    addHistory(`${a} ${op} ${b}`,out);
    current=out; previous=null; operator=null; waiting=true; render();
  }
  function showError() {
    current='Error'; previous=null; operator=null; waiting=true; render();
  }
  function clearAll(){current='0';previous=null;operator=null;waiting=false;render();}
  function toggleSign(){ if(current!=='0'&&current!=='Error') current=String(Number(current)*-1); render(); }
  function percent(){ if(current!=='Error') current=String(Number(current)/100); render(); }
  function addHistory(expr,out) {
    history.unshift({expr,out}); history=history.slice(0,10);
    historyEl.classList.add('show');
    historyList.innerHTML=history.map(x=>`<div class="history-item">${x.expr}<b>= ${x.out}</b></div>`).join('');
  }
  function backspace(){
    if(waiting || current==='Error') return;
    current=current.length>1?current.slice(0,-1):'0'; render();
  }

  document.getElementById('keys').addEventListener('click', e => {
    const b=e.target.closest('button'); if(!b)return;
    const v=b.dataset.value, a=b.dataset.action;
    if(v!==undefined){ if(/[0-9]/.test(v)) inputDigit(v); else if(v==='.') inputDecimal(); else chooseOperator(v); }
    if(a==='clear')clearAll(); if(a==='sign')toggleSign(); if(a==='percent')percent(); if(a==='equals')equals();
  });
  document.addEventListener('keydown', e => {
    const k=e.key;
    if(/[0-9]/.test(k)) inputDigit(k);
    else if(k==='.') inputDecimal();
    else if(['+','-','*','/'].includes(k)) chooseOperator({'+':'+','-':'−','*':'×','/':'÷'}[k]);
    else if(k==='Enter'||k==='=') equals();
    else if(k==='Escape') clearAll();
    else if(k==='Backspace') backspace();
    else if(k==='%') percent();
  });
  document.getElementById('clearHistory').onclick=()=>{history=[];historyList.innerHTML='';historyEl.classList.remove('show');};
  document.getElementById('themeBtn').onclick=()=>{
    document.body.classList.toggle('light');
    const light=document.body.classList.contains('light');
    if(light){
      document.documentElement.style.setProperty('--bg','#eef2ff');
      document.documentElement.style.setProperty('--panel','rgba(255,255,255,.84)');
      document.documentElement.style.setProperty('--text','#111827');
      document.documentElement.style.setProperty('--muted','#64748b');
      document.documentElement.style.setProperty('--key','#eef2f7');
      document.documentElement.style.setProperty('--border','rgba(15,23,42,.09)');
      document.getElementById('themeBtn').textContent='☾';
    }else location.reload();
  };
  render();
})();
</script>
</body>
</html>
